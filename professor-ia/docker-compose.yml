version: "3.8"
services:
  professor-ia:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - SECRET_KEY=troque-por-uma-chave-secreta-aleatoria-aqui
      - FLASK_DEBUG=false
    volumes:
      - professor_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  professor_data:
